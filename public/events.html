<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Events — Rise of Dahalo</title>
<meta name="description" content="Guild activity sign-up events for Rise of Dahalo — shared with the Discord bot's /event commands.">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/builds.css">
<link rel="stylesheet" href="css/events.css">
<!-- roster.css supplies the --rank-gold/silver/bronze tokens, profile.css
     the .ring-*/.tier-* classes built on them — both reused as-is for the
     player snippet's tier ring, same combo profile.html/roster.html load. -->
<link rel="stylesheet" href="css/roster.css">
<link rel="stylesheet" href="css/profile.css">
</head>
<body class="app-shell">
<script src="js/theme-loader.js"></script>

<!-- HEADER -->
<header class="site-header">
  <a href="index.html" class="brand">
    <div class="guild-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.5 3.4 9.7 8 11 4.6-1.3 8-5.5 8-11V6l-8-4z"/><path d="M12 7v9M9 10l3-3 3 3" stroke="#0d0d0f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </div>
    <div class="header-text">
      <h1>RISE OF DAHALO</h1>
      <span class="eyebrow">Events</span>
    </div>
  </a>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="builds.html">Builds</a>
    <a href="roster.html">Roster</a>
    <a href="events.html" class="logged-in-only active" id="events-nav-link">Events</a>
    <a href="loot.html" class="logged-in-only" id="loot-nav-link">Loot Manager</a>
    <a href="comps.html" class="officer-only" id="comps-nav-link">Compositions</a>
  </nav>
  <div class="header-actions">
    <div id="auth-control"></div>
  </div>
</header>

<!-- GATE: shown until we know the visitor is at least a logged-in Discord member -->
<div class="wrap section" id="gate-message" style="display:none">
  <div class="section-head">
    <h2 class="section-title">Members only</h2>
    <p class="section-sub">Events are for guild members — log in with your Discord account to view and sign up.</p>
  </div>
  <a class="cta-primary" href="/auth/login?returnTo=/events.html" style="display:inline-flex">Log in with Discord</a>
</div>

<!-- LOADING STATE -->
<div class="wrap section" id="events-loading-view">
  <div class="loading-state">
    <div class="spinner spinner-lg"></div>
    <span>Loading events…</span>
  </div>
</div>

<!-- LIST VIEW -->
<div class="app-main" id="events-list-view" style="display:none">

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="event-search" placeholder="Search events…" autocomplete="off">
    </div>
    <div class="filter-group" id="event-type-filter">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="PVP">⚔️ PVP</button>
      <button class="filter-btn" data-type="PVE">🐉 PVE</button>
      <button class="filter-btn" data-type="Gank">🗡️ Gank</button>
    </div>
    <span class="count-label" id="event-count-label">0 events</span>
    <button class="comp-reset-btn" id="toggle-closed-btn">Show closed events</button>
    <button class="comp-add-btn officer-only" id="new-event-btn"><span class="btn-label">+ New event</span></button>
  </div>

  <div class="event-card-grid" id="event-card-grid"></div>
  <div class="empty-state" id="event-empty" style="display:none">No events match your filters.</div>
</div>

<!-- DETAIL VIEW -->
<div class="app-main event-detail-app" id="event-detail-view" style="display:none">
  <div class="event-detail-head-row">
    <button class="detail-back-btn event-detail-back" id="event-back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to events
    </button>
    <div class="event-role-counter-row" id="event-role-counter-row"></div>
  </div>
  <div class="event-detail-layout" id="event-detail-layout">
    <!-- filled by events.js: info column / roster columns / signups column -->
  </div>
</div>

<!-- CREATE / EDIT FORM (officer/admin only) -->
<div class="modal-overlay" id="event-form-overlay" style="display:none">
  <div class="modal-card" id="event-form-card"></div>
</div>

<div id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/item-map.js"></script>
<script src="js/events.js"></script>
<script src="js/site.js"></script>
</body>
</html>
